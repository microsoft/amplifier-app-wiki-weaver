[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-weaver"
version = "4.0.0.dev0"
description = "WikiWeaver V4: a lens-steered wiki built by a pure dot graph on the dot-runner engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
# No LLM client library, by design: every model call is a box node in pipeline/*.dot,
# run by the dot-runner engine (a separate install; `wiki-weaver doctor` checks it).
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[dependency-groups]
# `uv run` installs this group by default, so `uv run ruff check .` and `uv run pytest` work.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wiki-weaver = "wiki_weaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wiki_weaver"]

[tool.hatch.build.targets.wheel.force-include]
"pipeline" = "wiki_weaver/pipeline"

[tool.hatch.build.hooks.custom]
path = "build_hook.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
