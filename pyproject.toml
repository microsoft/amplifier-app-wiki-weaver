[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-weaver"
version = "2.0.0"
description = "wiki-weaver v2 -- deterministic ingest pipeline for the attractor engine"
readme = "docs/DESIGN.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["wiki_weaver"]

[tool.pytest.ini_options]
testpaths = ["eval"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pyright]
include = ["wiki_weaver", "eval"]
pythonVersion = "3.11"
