name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        # V4's suite. Model-free: no API key is set, and tests that drive the dot-runner
        # engine skip when it is not installed (it is a separate `uv tool`).
        run: uv run pytest tests/ -q

      - name: Resolution smoke -- uv tool install (fresh-install regression guard)
        # `uv run` above resolves the dev environment, not an end-user install,
        # so it cannot see install-time resolution regressions. This exercises the SAME
        # resolution path a real `uv tool install git+https://...` does, against
        # the checked-out commit via git+file://.
        #
        # Explicit @$GITHUB_SHA ref is REQUIRED here (review finding, CI-
        # verified failure): actions/checkout's default shallow clone does not
        # set up `refs/remotes/origin/HEAD`, so a bare `git+file://$GITHUB_
        # WORKSPACE` (no ref) fails with "failed to find default branch HEAD"
        # -- uv's git backend has nothing to default to. Pinning the exact
        # commit under test sidesteps that entirely (and is more precise: it
        # tests the actual PR commit, not whatever HEAD happens to resolve to).
        run: |
          uv tool install "git+file://$GITHUB_WORKSPACE@$GITHUB_SHA"
